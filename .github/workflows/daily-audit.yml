name: Daily SaaS Pricing Audit & CDC Snapshot

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm crawl
      - run: pnpm bake
      - run: pnpm verify
      - name: Commit daily CDC snapshot
        run: |
          git config user.name "saas-audit-bot"
          git config user.email "bot@szoloth.com"
          git add data/history/
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily SaaS pricing snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
